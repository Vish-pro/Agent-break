# Usage (on the VPS, from repo root):
#   cp deploy/.env.example deploy/.env && edit it
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  relay:
    build: { context: .., dockerfile: server/Dockerfile }
    restart: unless-stopped
    environment:
      REGISTRATION_SECRET: ${REGISTRATION_SECRET:?set REGISTRATION_SECRET}
      TRUST_PROXY: "true"
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    volumes: [relay-data:/data]
    expose: ["8080"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Automatic HTTPS (Let's Encrypt). Needs a domain pointing at this host, e.g. free DuckDNS.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [relay]

volumes:
  relay-data:
  caddy-data:
